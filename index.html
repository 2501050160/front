<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020617" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />
    <link rel="manifest" href="/manifest.json" />
    <title>Cloud Print</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #020617;
        color: #f8fafc;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div style="min-height: 100vh; background-color: #020617; display: flex; flex-direction: column; align-items: center; justify-content: center;">
        <div style="width: 44px; height: 44px; border: 3px solid rgba(255,255,255,0.08); border-top-color: #38bdf8; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
        <p style="margin-top: 14px; color: #94a3b8; font-size: 11px; font-weight: 800; letter-spacing: 0.15em; text-transform: uppercase;">Cloud Print</p>
      </div>
    </div>
    <script>
      // Automatically recover from stale chunks on new deployments
      window.addEventListener('vite:preloadError', (event) => {
        window.location.reload();
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol === 'https:') {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            reg.update();
          }).catch(() => {});
        });
      }
    </script>
  </body>
</html>
